<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Semua Desain Jersey | GLOBAL ZONE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neon: {
                cyan: "#00F0FF",
                purple: "#7000FF"
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: Outfit, sans-serif; }
      #design-grid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 20px !important;
      }
      @media (max-width: 767px) {
        #design-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          gap: 10px !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#05050A] text-slate-100 antialiased">
    <!-- NAVBAR MINIMALIS -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-[#05050A]/80 backdrop-blur-xl border-b border-slate-900 h-20 flex items-center">
      <div class="max-w-7xl mx-auto px-4 w-full flex items-center justify-between">
        <a href="index.html">
          <img src="images/LOGO2.webp" alt="Global Zone" class="w-[130px] h-auto object-contain">
        </a>
        <a href="index.html" class="text-xs text-slate-400 hover:text-neon-cyan flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
        </a>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="mb-12">
        <span class="text-neon-cyan text-xs font-black uppercase tracking-widest">Eksplorasi Lengkap</span>
        <h1 class="text-3xl sm:text-4xl font-black mt-2">Semua Koleksi Desain Jersey</h1>
        <p class="text-slate-400 text-sm mt-2">Urutan otomatis dari yang paling baru dirilis.</p>
      </div>

      <!-- Container Render Semua Desain -->
      <div id="design-grid"></div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
